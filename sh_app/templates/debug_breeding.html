<!DOCTYPE html>
<html>
<head>
    <title>Debug Breeding Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1>Debug Breeding Flow</h1>
        <div class="alert alert-info">
            <h4>This will auto-select 2 rams and proceed to breeding task</h4>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Start Debug Flow</button>
            <a href="{% url 'breeding_selection' %}" class="btn btn-secondary">Go to Normal Selection</a>
        </form>
        
        {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
